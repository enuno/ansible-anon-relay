# Update existing Anon relay deployments
# Updates Docker images and configurations
- name: Update Anon Relays
  hosts: relays
  become: yes
  gather_facts: yes
  pre_tasks:
    - name: Display update banner
      debug:
        msg: |
          ===========================================
          ANON RELAY UPDATE
          ===========================================
          Host: {{ inventory_hostname }}
          Relay Type: {{ anon_relay_type | default('standard') }}
          ===========================================
      tags:
        - always
        - info
    - name: Check if Anon container exists
      community.docker.docker_container_info:
        name: "{{ anon_container_name | default('anon-relay') }}"
      register: container_info
      tags:
        - update
        - check
    - name: Fail if container doesn't exist
      fail:
        msg: "Anon container not found. Run deployment playbook first."
      when: not container_info.exists
      tags:
        - update
        - check
  roles:
    - role: docker_setup
      tags:
        - docker
        - update
    - role: anon_relay_base
      tags:
        - anon
        - base
        - update
    - role: anon_relay_standard
      when: anon_relay_type | default('standard') == 'standard'
      tags:
        - anon
        - standard
        - update
    - role: anon_relay_exit
      when: anon_relay_type | default('standard') == 'exit'
      tags:
        - anon
        - exit
        - update
    - role: anon_relay_socks
      when: anon_relay_type | default('standard') == 'socks'
      tags:
        - anon
        - socks
        - update
    - role: anon_relay_monitor
      when: anon_monitoring_enabled | default(true)
      tags:
        - monitoring
        - nyx
        - update
  post_tasks:
    - name: Run health checks
      include_role:
        name: health_checks
      tags:
        - health
        - checks
    - name: Display update summary
      debug:
        msg: |
          ===========================================
          UPDATE COMPLETE
          ===========================================
          Host: {{ inventory_hostname }}
          Relay Type: {{ anon_relay_type | default('standard') }}
          Status: Updated successfully
          ===========================================
      tags:
        - always
        - info
