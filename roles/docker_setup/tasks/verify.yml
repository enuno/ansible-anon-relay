# Docker installation verification tasks
- name: Check Docker version
  command: docker --version
  register: docker_version_result
  changed_when: false
  tags:
    - docker
    - verify
- name: Check Docker Compose version
  command: docker compose version
  register: docker_compose_version_result
  changed_when: false
  tags:
    - docker
    - verify
- name: Test Docker daemon connectivity
  command: docker info
  register: docker_info_result
  changed_when: false
  tags:
    - docker
    - verify
- name: Display Docker installation information
  debug:
    msg:
      - "Docker version: {{ docker_version_result.stdout }}"
      - "Docker Compose version: {{ docker_compose_version_result.stdout }}"
      - "Docker daemon status: {{ 'Running' if docker_info_result.rc == 0 else 'Not running' }}"
  tags:
    - docker
    - verify
