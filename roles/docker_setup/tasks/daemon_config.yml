# Docker daemon configuration tasks
- name: Create Docker daemon configuration directory
  file:
    path: "{{ docker_daemon_config_dir }}"
    state: directory
    mode: '0755'
  tags:
    - docker
    - config
- name: Configure Docker daemon
  copy:
    content: "{{ docker_daemon_config | to_nice_json }}"
    dest: "{{ docker_daemon_config_file }}"
    mode: '0644'
    backup: yes
  notify: restart docker
  tags:
    - docker
    - config
- name: Ensure Docker daemon configuration is valid
  command: docker info
  register: docker_info_result
  changed_when: false
  failed_when: false
  tags:
    - docker
    - verify
