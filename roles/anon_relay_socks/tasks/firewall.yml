# Firewall configuration for SOCKS proxy
- name: Install UFW
  package:
    name: ufw
    state: present
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Reset UFW to defaults
  ufw:
    state: reset
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Set UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: "incoming", policy: "deny"}
    - {direction: "outgoing", policy: "allow"}
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Allow SSH access
  ufw:
    rule: allow
    port: "{{ anon_ssh_port }}"
    proto: tcp
    comment: "SSH access"
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Allow SOCKS port access
  ufw:
    rule: allow
    port: "{{ anon_socks_port }}"
    proto: tcp
    comment: "SOCKS proxy access"
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Allow SOCKS port from LAN only
  ufw:
    rule: allow
    port: "{{ anon_socks_port }}"
    proto: tcp
    src: "{{ anon_socks_policy_accept }}"
    comment: "SOCKS proxy access from LAN"
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Enable UFW
  ufw:
    state: enabled
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Display UFW status
  command: ufw status verbose
  register: ufw_status
  changed_when: false
  tags:
    - anon
    - socks
    - firewall
    - ufw
- name: Show UFW status
  debug:
    msg: "{{ ufw_status.stdout_lines }}"
  tags:
    - anon
    - socks
    - firewall
    - ufw
