# Anon Relay Deployment Inventory - EXAMPLE FILE
# Copy this file to inventory.ini and customize for your environment
# cp inventory.example.ini inventory.ini

# ===================================================================
# STANDARD RELAYS
# ===================================================================
# Standard (middle/guard) relays are the most common type.
# They route traffic through the Anyone network without exposing your IP.
#
# Requirements:
# - Public IP address
# - Ports 9001 (OR) and 9030 (Dir) open
# - At least 512MB RAM
#
[standard_relays]
# Example with IP address
relay1.example.com ansible_host=192.0.2.10 ansible_user=ubuntu

# Example with hostname
relay2.example.com ansible_user=debian

# Example with custom SSH port
# relay3.example.com ansible_user=ubuntu ansible_port=2222

# ===================================================================
# EXIT RELAYS
# ===================================================================
# Exit relays are the final hop where traffic exits to the public internet.
#
# ⚠️  WARNING: Operating an exit relay has legal implications!
# - Your IP will be visible to destination sites
# - You may receive abuse complaints
# - Consult legal counsel before deploying
# - Ensure you understand local laws
#
[exit_relays]
# exit1.example.com ansible_user=ubuntu
# exit2.example.com ansible_user=debian

# ===================================================================
# SOCKS PROXIES
# ===================================================================
# SOCKS proxies enable devices on your local network to use the Anyone network.
# These are typically deployed on your local network, not public servers.
#
[socks_proxies]
# socks1.local ansible_host=192.168.1.100 ansible_user=pi
# socks2.local ansible_host=10.0.0.50 ansible_user=ubuntu

# ===================================================================
# GROUP DEFINITIONS
# ===================================================================
# Group all relay types together for operations that apply to all relays
[relays:children]
standard_relays
exit_relays

# ===================================================================
# GLOBAL VARIABLES
# ===================================================================
# These apply to all hosts unless overridden in group_vars/ or host_vars/
#
# TIP: For better organization, define most variables in group_vars/
#      instead of in this inventory file.
#
[all:vars]
# Ansible connection settings
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Uncomment if using non-standard SSH key
# ansible_ssh_private_key_file=~/.ssh/anon_relay_key

# Uncomment if SSH user needs password for sudo
# ansible_become_pass='{{ vault_become_pass }}'

# ===================================================================
# COMMON SCENARIOS
# ===================================================================

# --- Single Relay Deployment ---
# [standard_relays]
# relay.example.com ansible_user=ubuntu

# --- Multiple Relays with Different Users ---
# [standard_relays]
# relay1.example.com ansible_user=ubuntu
# relay2.example.com ansible_user=debian
# relay3.example.com ansible_user=fedora

# --- Using SSH Jump Host (Bastion) ---
# [standard_relays]
# relay1.internal ansible_host=10.0.1.10 ansible_user=ubuntu
#
# [standard_relays:vars]
# ansible_ssh_common_args='-o ProxyJump=bastion.example.com'

# --- Different SSH Ports ---
# [standard_relays]
# relay1.example.com ansible_port=2222 ansible_user=ubuntu
# relay2.example.com ansible_port=2223 ansible_user=ubuntu

# --- IPv6 Only Hosts ---
# [standard_relays]
# relay1.example.com ansible_host=2001:db8::1 ansible_user=ubuntu

# ===================================================================
# NEXT STEPS
# ===================================================================
# 1. Copy this file: cp inventory.example.ini inventory.ini
# 2. Edit inventory.ini with your server details
# 3. Configure variables in group_vars/ directory
# 4. Test connectivity: ansible all -i inventory.ini -m ping
# 5. Deploy: ansible-playbook -i inventory.ini site.yml
